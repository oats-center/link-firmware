[package]
name = "link-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "time-driver-any", "stm32g031k8", "memory-x", "unstable-pac", "exti"]  }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

portable-atomic = { version = "1", features = ["critical-section"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-hal-internal = "0.5.0"

embassy-net = { version = "0.6.0", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet"] }
embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
embedded-hal-bus = { version = "0.2.0", features = ["async"] }
static_cell = "2.1"

[profile.release]
debug = 2

[[bin]]
name = "link-firmware"
test = false
bench = false
doctest = false
